name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    name: Syntax check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Node syntax check
        run: |
          set -e
          files=$(find src -name '*.js' -not -path '*/node_modules/*')
          for f in $files; do
            echo "checking $f"
            node --check "$f"
          done
